<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{title}}</title>
<meta name="description" content="{{description}}" />
<meta name="author" content="{{author}}" />
<link rel="icon" type="image/png" href="assets/img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<a class="skip-link" href="#about">Skip to content</a>

<nav class="navbar">
  <div class="nav-inner">
    <a href="#top" class="nav-brand">
      <span>Qing Wu</span>
    </a>
    <div id="site-nav-links" class="nav-links">
      <a href="#about">About</a>
      <a href="friends/">Friends</a>
    </div>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
      <i class="fas fa-moon" aria-hidden="true"></i>
    </button>
    <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Open navigation" aria-controls="site-nav-links" aria-expanded="false"><i class="fas fa-bars" aria-hidden="true"></i></button>
  </div>
</nav>

<main id="top" class="page-layout">
  {{profile}}
  <div class="page-content">

  <section id="about" class="section">
    <h2 class="section-title">About</h2>
    <div class="about-copy">
      {{about}}
    </div>
  </section>

  <section id="news" class="section">
    <h2 class="section-title">News</h2>
    {{news}}
  </section>

  <section id="publications" class="section">
    <div class="section-heading">
      <h2 class="section-title">Selected Publications</h2>
      <a class="view-all" href="https://scholar.google.com/citations?user=A1E80HUAAAAJ" target="_blank" rel="noopener">View all <i class="fas fa-arrow-right" aria-hidden="true"></i></a>
    </div>
    <p class="section-sub">* indicates equal contribution. See the full list on my <a href="https://scholar.google.com/citations?user=A1E80HUAAAAJ" target="_blank" rel="noopener">Google Scholar</a>.</p>
    <div class="pub-list">
      {{publications}}
    </div>
  </section>

  </div>
</main>

<footer class="site-footer">
  <p>© <span id="year"></span> Qing Wu · Built with plain HTML/CSS — hosted on GitHub Pages.</p>
</footer>

<script src="assets/js/main.js"></script>
</body>
</html>
